name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q keeper.py
      - name: Tests
        run: python -m unittest tests.test_keeper -v
      - name: Node syntax
        run: node --check bin/keeper.js
      - name: Bash syntax
        run: bash -n bin/keeper.sh
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: rust/mega-keeper-cli
        run: cargo build --release
      - name: Tests
        working-directory: rust/mega-keeper-cli
        run: cargo test --quiet
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: shellcheck -S warning bin/keeper.sh
